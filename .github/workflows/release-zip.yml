name: Create Release Zip

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach (for example v1.0.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Upload Release Zip
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag being released
        id: release
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the tagged commit, not the tip of the default branch, so the
          # archive can never contain work that the tag does not include.
          ref: ${{ steps.release.outputs.tag }}

      - name: Prepare plugin folder
        run: |
          # The folder name MUST match the plugin slug, or WordPress installs the
          # plugin under an unusable directory name.
          mkdir -p dist/chip-for-formidable-forms
          git archive HEAD | tar -x -C dist/chip-for-formidable-forms

          # `git archive` honours .gitattributes export-ignore, but that rule only
          # applies from the commit that carries it. Prune the build-time files
          # explicitly so a release cut from an older tag still ships a clean
          # archive rather than whatever that tag's .gitattributes allowed.
          rm -rf dist/chip-for-formidable-forms/scripts \
                 dist/chip-for-formidable-forms/.github \
                 dist/chip-for-formidable-forms/.wordpress-org \
                 dist/chip-for-formidable-forms/vendor

          echo "Prepared plugin folder"
          ls -la dist/chip-for-formidable-forms/

      - name: Create zip file
        run: |
          cd dist && zip -r ../chip-for-formidable-forms.zip chip-for-formidable-forms
          echo "Created chip-for-formidable-forms.zip (root folder: chip-for-formidable-forms/)"

      - name: Verify the archive matches the tag
        run: |
          if unzip -l chip-for-formidable-forms.zip | grep -qE '(^|/)(scripts|\.github|vendor|\.wordpress-org)/'; then
            echo "A build-time directory reached the release archive:"
            unzip -l chip-for-formidable-forms.zip | grep -E '(^|/)(scripts|\.github|vendor|\.wordpress-org)/'
            exit 1
          fi

          # The archive must carry the version its tag claims, or a merchant
          # downloads a file that disagrees with the release page.
          WANT="${{ steps.release.outputs.tag }}"
          WANT="${WANT#v}"
          GOT=$(unzip -p chip-for-formidable-forms.zip chip-for-formidable-forms/chip-for-formidable-forms.php \
                | grep -m1 '^ \* Version:' | sed 's/.*Version: *//' | tr -d '\r')
          if [ "$GOT" != "$WANT" ]; then
            echo "Archive reports version '$GOT' but the tag is '$WANT'"
            exit 1
          fi

          echo "Archive is clean and reports version $GOT"

      - name: Upload release asset
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" chip-for-formidable-forms.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
